<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《灵气复苏的低调剑仙》- 墨笔-OS 创作可视化看板</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Serif+SC:wght@300;600;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 极致暗黑国风美学 Tokens */
      --bg-deep: #0a0c10;
      --bg-panel: rgba(18, 22, 28, 0.75);
      --bg-card: rgba(26, 32, 40, 0.5);
      --primary-gold: #d4af37;
      --primary-cyan: #00f0ff;
      --primary-cyan-rgb: 0, 240, 255;
      --text-main: #e2e8f0;
      --text-muted: #8a9cae;
      --border-glow: rgba(0, 240, 255, 0.12);
      --border-gold: rgba(212, 175, 55, 0.2);
      
      --glass-blur: blur(16px);
      --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
      --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Outfit', 'Noto Serif SC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 50% -20%, rgba(var(--primary-cyan-rgb), 0.15), transparent 60%);
    }

    /* 顶部光晕装饰 */
    .top-glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1400px;
      height: 300px;
      background: radial-gradient(ellipse at center, rgba(var(--primary-cyan-rgb), 0.05), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    /* 头部设计 */
    header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    header h1 {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 20px rgba(var(--primary-cyan-rgb), 0.4);
      margin-bottom: 10px;
    }

    header .meta-sub {
      color: var(--text-muted);
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    header .meta-sub span {
      color: var(--primary-gold);
      font-weight: 600;
      margin: 0 10px;
    }

    /* 数据总览卡片网格 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--glass-shadow);
      text-align: center;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-cyan), var(--primary-gold));
      opacity: 0.8;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: rgba(var(--primary-cyan-rgb), 0.4);
      box-shadow: 0 12px 30px rgba(var(--primary-cyan-rgb), 0.1);
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .stat-card p {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      font-family: 'Outfit', sans-serif;
    }

    .stat-card .unit {
      font-size: 1rem;
      color: var(--primary-gold);
      font-weight: 600;
      margin-left: 4px;
    }

    /* 选项卡栏 (Obsidian Glassmorphism Tabs) */
    .tabs-bar {
      display: flex;
      justify-content: center;
      background: rgba(15, 20, 27, 0.6);
      backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 50px;
      padding: 6px;
      margin-bottom: 40px;
      gap: 10px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: var(--transition-smooth);
      font-family: 'Noto Serif SC', sans-serif;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #000;
      background: linear-gradient(135deg, var(--primary-cyan), #00d2ff);
      box-shadow: 0 4px 15px rgba(var(--primary-cyan-rgb), 0.4);
      font-weight: 800;
    }

    /* 内容面板 */
    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 卡片布局通用样式 */
    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 25px;
      box-shadow: var(--glass-shadow);
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-gold);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.05);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 12px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
    }

    .card-tag {
      background: rgba(var(--primary-cyan-rgb), 0.1);
      border: 1px solid var(--border-glow);
      color: var(--primary-cyan);
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .card-tag.gold {
      background: rgba(212, 175, 55, 0.1);
      border-color: var(--border-gold);
      color: var(--primary-gold);
    }

    .card-tag.red {
      background: rgba(255, 75, 75, 0.1);
      border-color: rgba(255, 75, 75, 0.2);
      color: #ff4b4b;
    }

    .card-body {
      flex-grow: 1;
    }

    .info-item {
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    .info-label {
      color: var(--text-muted);
      font-weight: 600;
      margin-right: 8px;
      display: inline-block;
      min-width: 70px;
    }

    .info-val {
      color: var(--text-main);
    }

    .card-desc {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
      color: var(--text-muted);
      white-space: pre-line;
    }

    /* 大纲列表特化样式 */
    .outline-section {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 30px;
      box-shadow: var(--glass-shadow);
      margin-bottom: 30px;
    }

    .outline-section h2 {
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 20px;
      border-left: 4px solid var(--primary-cyan);
      padding-left: 15px;
      font-family: 'Noto Serif SC', sans-serif;
    }

    .chapter-tree {
      margin-left: 20px;
      border-left: 2px dashed rgba(255, 255, 255, 0.08);
      padding-left: 20px;
    }

    .chapter-item {
      position: relative;
      margin-bottom: 15px;
      padding: 15px;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      transition: var(--transition-smooth);
    }

    .chapter-item::before {
      content: '';
      position: absolute;
      left: -21px;
      top: 50%;
      width: 10px;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .chapter-item:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(var(--primary-cyan-rgb), 0.2);
    }

    /* 伏笔池专属卡片 */
    .clue-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .clue-row {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 20px;
      display: grid;
      grid-template-columns: 80px 200px 120px 1fr;
      align-items: center;
      gap: 20px;
      box-shadow: var(--glass-shadow);
      transition: var(--transition-smooth);
    }

    .clue-row:hover {
      border-color: var(--border-glow);
      transform: translateX(3px);
    }

    .clue-id {
      font-family: 'Outfit', sans-serif;
      color: var(--primary-cyan);
      font-weight: 800;
      font-size: 0.95rem;
    }

    .clue-title {
      font-weight: 800;
      color: #fff;
      font-size: 1.1rem;
    }

    .clue-status {
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-badge.inactive {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .status-badge.active {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border-gold);
      color: var(--primary-gold);
    }

    .status-badge.completed {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--border-glow);
      color: var(--primary-cyan);
    }

    .clue-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 空数据渲染 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.3;
    }

    /* 底部设计 */
    footer {
      text-align: center;
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="top-glow"></div>
  
  <div class="container">
    <!-- 头部 -->
    <header>
      <h1 id="novel-title">《灵气复苏的低调剑仙》</h1>
      <div class="meta-sub">
        流派流派：<span id="novel-genre">cultivation</span>
        作者：<span id="novel-author">天码笔仙</span>
        字数进度：<span id="novel-words-progress">0.01万字</span> / <span>100 万字</span>
      </div>
    </header>

    <!-- 顶层指标卡网格 -->
    <section class="dashboard-grid">
      <div class="stat-card">
        <h3>全书章节数</h3>
        <p id="stat-chapters">0<span class="unit">章</span></p>
      </div>
      <div class="stat-card">
        <h3>正文字数量</h3>
        <p id="stat-words">0<span class="unit">字</span></p>
      </div>
      <div class="stat-card">
        <h3>人物设定数</h3>
        <p id="stat-characters">0<span class="unit">名</span></p>
      </div>
      <div class="stat-card">
        <h3>伏笔回收率</h3>
        <p id="stat-clues">0%</p>
      </div>
    </section>

    <!-- 导航选项卡 -->
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="switchTab('dashboard-panel', this)">创作大纲总览</button>
      <button class="tab-btn" onclick="switchTab('characters-panel', this)">人物档案卡</button>
      <button class="tab-btn" onclick="switchTab('factions-panel', this)">势力与地理</button>
      <button class="tab-btn" onclick="switchTab('clues-panel', this)">伏笔线索库</button>
    </div>

    <!-- 1. 创作大纲面板 -->
    <div id="dashboard-panel" class="tab-content active">
      <div class="outline-section">
        <h2>📖 小说全局总纲</h2>
        <div id="main-outline-container" style="color: var(--text-main); font-size: 1rem; line-height: 1.7; white-space: pre-wrap;">
          加载中...
        </div>
      </div>
      
      <div class="outline-section">
        <h2>🌳 章节大纲细纲树</h2>
        <div id="outlines-tree-container">
          <!-- 动态渲染章节细纲 -->
        </div>
      </div>
    </div>

    <!-- 2. 人物档案面板 -->
    <div id="characters-panel" class="tab-content">
      <div class="content-grid" id="characters-container">
        <!-- 动态渲染人物卡 -->
      </div>
    </div>

    <!-- 3. 势力与地理面板 -->
    <div id="factions-panel" class="tab-content">
      <div class="content-grid" id="factions-container">
        <!-- 动态势力卡 -->
      </div>
    </div>

    <!-- 4. 伏笔与线索面板 -->
    <div id="clues-panel" class="tab-content">
      <div class="clue-list" id="clues-container">
        <!-- 动态伏笔列表 -->
      </div>
    </div>

    <!-- 页脚 -->
    <footer>
      墨笔-OS (InkBrush-OS) 本地极客小说创作脚手架系统 · 像写代码一样写小说 · 零服务器本地静态页面
    </footer>
  </div>

  <script>
    // 注入的核心数据对象 (在 scripts/preview.js 生成时会被替换为真实 JSON)
    const NOVEL_DATA = {
  "config": {
    "novel_name": "灵气复苏的低调剑仙",
    "author": "天码笔仙",
    "genre": "cultivation",
    "target_words": 1000000,
    "tone_style": "文风沉稳，细节丰富，人物智商在线，叙事干净利落，拒绝无意义灌水。",
    "ai_writing_rules": {
      "words_per_scene_min": 1000,
      "words_per_scene_max": 1500,
      "enable_self_check": true,
      "language": "zh"
    },
    "compiler_options": {
      "output_file": "dist/精编定稿_灵气复苏的低调剑仙.txt",
      "include_volume_headers": true,
      "strip_html_comments": true,
      "strip_front_matter": true
    }
  },
  "main_outline": "# 《灵气复苏的低调剑仙》小说总大纲\n\n## Ⅰ. 核心风格与流派基调\n* **题材流派**：cultivation (修真玄幻)\n* **笔名作者**：天码笔仙\n* **文风基调**：文风沉稳，细节丰富，人物智商在线，叙事干净利落，拒绝无意义灌水。\n\n## Ⅱ. 世界观与势力网\n\n```mermaid\ngraph TD\n    A[第一卷: 微末崛起] --> B[第二卷: 声名鹊起]\n    B --> C[第三卷: 名震东荒]\n    \n    subgraph 人物核心冲突\n        主角[主角叶凌] --- 盟友[师姐苏清影]\n        主角 -.->|敌对| 反派[韩执事]\n    end\n```\n\n\n## Ⅲ. 主线核心矛盾与终极追求\n* **核心冲突**：(例：末法时代灵气衰微，大门派垄断资源。主角凭借神秘铁牌，低调逆袭，抗衡垄断势力。)\n* **主角终极追求**：(例：解开师尊失踪之谜，重塑天地秩序，踏入神道。)\n\n## Ⅳ. 境界等级体系规划\n* **境界规划**：(例：练气期 -> 筑基期 -> 金丹期 -> 元婴期 -> 化神期)\n* **战力界限约束**：每一境界差距犹如鸿沟，绝对严禁越级秒杀，突出招式妙用与法宝克制。\n",
  "stats": {
    "total_words": 121,
    "total_chapters": 1
  },
  "characters": [
    {
      "name": "主角_叶凌",
      "power_level": "凡人",
      "identity": "暂无",
      "faction": "散修",
      "status": "正常",
      "description": "> **使用说明**：当创建新人物时，请复制此模板并命名为 `人物名.md`，然后填写各模块。此结构能帮助 AI 在写作时绝对还原人设，杜绝 OOC（人物性格崩坏）。\n\n---\nname: \"叶凌\"\nalias: \"无名仙客\"\nage: \"18岁\"\nidentity: \"太玄门拙峰废柴杂役弟子\"\nfaction: \"所属势力\"\nstatus: \"存活/受伤/失踪\"\npower_level: \"练气一层\"\nrelationships: { \"苏清影\": \"盟友/师姐\", \"韩执事\": \"敌对\" }\n---\n\n* **外貌衣着**：(例：常穿一袭洗得发白的青色道袍，身材略显消瘦，眼神清澈而深邃，腰"
    }
  ],
  "factions": [],
  "clues": [
    {
      "id": "clue_01_mysterious_token",
      "name": "主角身上的神秘黑铁牌",
      "status": "未激活",
      "chapter_introduced": 1,
      "description": "主角下山前师父留给他的铁牌，通体冰冷，上面刻有模糊的符文，似乎与太玄门拙峰有某种共鸣。"
    }
  ],
  "outlines": [
    {
      "volume_name": "第一卷 微末崛起",
      "chapters": [
        {
          "chapter_title": "第001章_细纲",
          "summary": "(一两句话概括本章发生了什么，达成了什么主线目的，例如：主角叶凡通过系统测试，在太玄门招新中藏拙，却暗中领悟了无上秘法)\n\n---"
        }
      ]
    }
  ]
};

    // 初始化渲染页面
    window.onload = function() {
      renderDashboard();
      renderCharacters();
      renderFactions();
      renderClues();
    };

    // 选项卡切换逻辑
    function switchTab(panelId, btn) {
      document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(panelId).classList.add('active');
      btn.classList.add('active');
    }

    // 渲染总览面板
    function renderDashboard() {
      // 全局元数据
      document.getElementById('novel-title').innerText = `《\${NOVEL_DATA.config.novel_name || '墨笔小说'}》`;
      document.getElementById('novel-author').innerText = NOVEL_DATA.config.author || '天码笔仙';
      
      const genreMap = {
        'cultivation': '修真玄幻 ⚔️',
        'urban': '都市爽文 🏙️',
        'scifi': '科幻悬疑 🦾',
        'romance': '言情轻小说 🌸'
      };
      document.getElementById('novel-genre').innerText = genreMap[NOVEL_DATA.config.genre] || NOVEL_DATA.config.genre;
      
      const totalWords = NOVEL_DATA.stats.total_words;
      const targetWords = NOVEL_DATA.config.target_words ? NOVEL_DATA.config.target_words / 10000 : 100;
      document.getElementById('novel-words-progress').innerText = `\${(totalWords / 10000).toFixed(2)} 万字`;
      
      // 数据卡片
      document.getElementById('stat-chapters').innerHTML = `\${NOVEL_DATA.stats.total_chapters}<span class="unit">章</span>`;
      document.getElementById('stat-words').innerHTML = `\${totalWords.toLocaleString()}<span class="unit">字</span>`;
      document.getElementById('stat-characters').innerHTML = `\${NOVEL_DATA.characters.length}<span class="unit">名</span>`;
      
      // 伏笔回收率
      const clues = NOVEL_DATA.clues || [];
      const completedClues = clues.filter(c => c.status === '已收回/完成').length;
      const recycleRate = clues.length > 0 ? Math.round((completedClues / clues.length) * 100) : 0;
      document.getElementById('stat-clues').innerHTML = `\${recycleRate}<span class="unit">%</span>`;

      // 全局总纲文本
      document.getElementById('main-outline-container').innerText = NOVEL_DATA.main_outline || '暂无全局总纲设定，请在根目录下创建 [小说总纲.md]';

      // 章节细纲树渲染
      const outlineTreeContainer = document.getElementById('outlines-tree-container');
      if (NOVEL_DATA.outlines && NOVEL_DATA.outlines.length > 0) {
        let treeHtml = '';
        NOVEL_DATA.outlines.forEach(vol => {
          treeHtml += `<div style="margin-bottom: 20px;">`;
          treeHtml += `<h3 style="color: var(--primary-gold); margin-bottom: 12px; font-size: 1.2rem;">📂 \${vol.volume_name}</h3>`;
          treeHtml += `<div class="chapter-tree">`;
          
          if (vol.chapters && vol.chapters.length > 0) {
            vol.chapters.forEach(ch => {
              treeHtml += `
                <div class="chapter-item">
                  <h4 style="color: #fff; margin-bottom: 6px;">📖 \${ch.chapter_title}</h4>
                  <div style="color: var(--text-muted); font-size: 0.9rem; white-space: pre-wrap;">\${ch.summary || '暂无章节细纲描述。'}</div>
                </div>
              `;
            });
          } else {
            treeHtml += `<div style="color: var(--text-muted);">本卷暂无章节大纲</div>`;
          }
          treeHtml += `</div></div>`;
        });
        outlineTreeContainer.innerHTML = treeHtml;
      } else {
        outlineTreeContainer.innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div>暂无章节大纲数据</div>`;
      }
    }

    // 渲染人物卡
    function renderCharacters() {
      const container = document.getElementById('characters-container');
      if (NOVEL_DATA.characters && NOVEL_DATA.characters.length > 0) {
        let html = '';
        NOVEL_DATA.characters.forEach(char => {
          const statusClass = char.status === '存活' || char.status === '正常' ? 'gold' : char.status === '死亡' ? 'red' : '';
          html += `
            <div class="card">
              <div class="card-header">
                <div class="card-title">\${char.name}</div>
                <div class="card-tag \${statusClass}">\${char.status || '正常'}</div>
              </div>
              <div class="card-body">
                <div class="info-item"><span class="info-label">境界/实力:</span><span class="info-val" style="color: var(--primary-cyan); font-weight:600;">\${char.power_level || '凡人'}</span></div>
                <div class="info-item"><span class="info-label">核心身份:</span><span class="info-val">\${char.identity || '暂无'}</span></div>
                <div class="info-item"><span class="info-label">所属门派:</span><span class="info-val">\${char.faction || '散修'}</span></div>
                <div class="card-desc">\${char.description || '暂无详细描述档案'}</div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-icon">👥</div>设定集/人物卡 文件夹中尚无角色卡文件</div>`;
      }
    }

    // 渲染势力卡
    function renderFactions() {
      const container = document.getElementById('factions-container');
      if (NOVEL_DATA.factions && NOVEL_DATA.factions.length > 0) {
        let html = '';
        NOVEL_DATA.factions.forEach(fac => {
          html += `
            <div class="card">
              <div class="card-header">
                <div class="card-title">\${fac.name}</div>
                <div class="card-tag gold">\${fac.type || '门派势力'}</div>
              </div>
              <div class="card-body">
                <div class="info-item"><span class="info-label">势力领袖:</span><span class="info-val">\${fac.leader || '未知'}</span></div>
                <div class="info-item"><span class="info-label">地理方位:</span><span class="info-val">\${fac.location || '未知'}</span></div>
                <div class="info-item"><span class="info-label">势力层级:</span><span class="info-val" style="color: var(--primary-cyan);">\${fac.tier || '未知'}</span></div>
                <div class="card-desc">\${fac.description || '暂无势力背景详情档案'}</div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-icon">🏰</div>设定集/势力与地理 文件夹中尚无势力卡文件</div>`;
      }
    }

    // 渲染伏笔线索库
    function renderClues() {
      const container = document.getElementById('clues-container');
      if (NOVEL_DATA.clues && NOVEL_DATA.clues.length > 0) {
        let html = '';
        NOVEL_DATA.clues.forEach(clue => {
          let badgeClass = 'inactive';
          if (clue.status === '已激活') badgeClass = 'active';
          else if (clue.status === '已收回/完成') badgeClass = 'completed';

          html += `
            <div class="clue-row">
              <div class="clue-id">\${clue.id}</div>
              <div class="clue-title">\${clue.name}</div>
              <div class="clue-status">
                <span class="status-badge \${badgeClass}">\${clue.status}</span>
              </div>
              <div class="clue-desc">
                <div>\${clue.description}</div>
                <div style="font-size: 0.8rem; color: var(--primary-gold); margin-top: 5px;">📍 引入章节：第 \${clue.chapter_introduced} 章</div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon">🕸️</div>.mobi/伏笔线索库.json 尚无伏笔数据记录</div>`;
      }
    }
  </script>
</body>
</html>
